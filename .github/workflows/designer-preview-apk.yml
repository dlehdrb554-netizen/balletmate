name: Designer live preview APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/designer-preview-apk.yml"
      - "app/**"
      - "components/**"
      - "lib/**"
      - "scripts/**"
      - "assets/**"
      - "app.json"
      - "package.json"

concurrency:
  group: balletmate-designer-preview-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-designer-preview:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify Expo dependencies
        run: npx expo install --check

      - name: Load EAS Preview environment variables
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::GitHub Actions secret EXPO_TOKEN이 필요합니다."
            exit 1
          fi
          npx eas-cli@latest env:pull --environment preview

      - name: Generate Android development client
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: npx expo prebuild --platform android --non-interactive

      - name: Verify Kakao key is embedded without printing it
        run: |
          node -e "const c=require('./app.config.js')({config:{}}); if(!c.extra?.kakaoJavascriptKey) { console.error('Kakao JavaScript key is missing from Expo config'); process.exit(1); } console.log('Kakao JavaScript key is present in Expo config.');"

      - name: Build installable development APK
        working-directory: android
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload designer preview APK
        uses: actions/upload-artifact@v4
        with:
          name: balletmate-designer-preview
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
