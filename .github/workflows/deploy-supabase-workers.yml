name: Deploy Balletmate Supabase Workers

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: balletmate-supabase-worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Edge Functions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ykxvcqgdvifogahbbbwr

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check required secret
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::GitHub Actions secret SUPABASE_ACCESS_TOKEN is not configured."
            exit 1
          fi

      - name: Deploy studio discovery worker
        run: supabase functions deploy studio-discovery-worker --project-ref "$SUPABASE_PROJECT_REF" --use-api --yes

      - name: Deploy studio image crawl worker
        run: supabase functions deploy crawl-studio-worker --project-ref "$SUPABASE_PROJECT_REF" --use-api --yes

      - name: Deploy studio crawler
        run: supabase functions deploy crawl-studio --project-ref "$SUPABASE_PROJECT_REF" --use-api --yes
