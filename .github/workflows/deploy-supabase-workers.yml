name: Deploy Balletmate Supabase Workers

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-supabase-workers.yml'

permissions:
  contents: read

concurrency:
  group: balletmate-supabase-worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Edge Functions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ykxvcqgdvifogahbbbwr

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 3.2.0

      - name: Check required secret
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::GitHub Actions secret SUPABASE_ACCESS_TOKEN is not configured."
            exit 1
          fi


      - name: Replace photo classifier with disabled endpoint
        run: supabase functions deploy classify-studio-photo --project-ref "$SUPABASE_PROJECT_REF" --use-api --yes
      - name: Retire photo and evidence worker
        run: supabase functions deploy crawl-studio-worker --project-ref "$SUPABASE_PROJECT_REF" --use-api --yes
      - name: Retire website text crawler
        run: supabase functions deploy crawl-studio --project-ref "$SUPABASE_PROJECT_REF" --use-api --yes
      - name: Retire Naver blog search
        run: supabase functions deploy search-studio-blogs --project-ref "$SUPABASE_PROJECT_REF" --use-api --yes
      - name: Retire Naver blog post crawler
        run: supabase functions deploy crawl-studio-blogs --project-ref "$SUPABASE_PROJECT_REF" --use-api --yes
      - name: Deploy studio discovery worker
        run: supabase functions deploy studio-discovery-worker --project-ref "$SUPABASE_PROJECT_REF" --use-api --yes

      - name: Deploy NEIS ballet academy discovery
        run: supabase functions deploy neis-ballet-discovery --project-ref "$SUPABASE_PROJECT_REF" --use-api --yes

      - name: Deploy NEIS Kakao verification
        run: supabase functions deploy neis-ballet-kakao-verification --project-ref "$SUPABASE_PROJECT_REF" --use-api --yes

      - name: Deploy NEIS-only geocoding
        run: supabase functions deploy neis-only-geocoding --project-ref "$SUPABASE_PROJECT_REF" --use-api --yes

      - name: Deploy Kakao studio search
        run: supabase functions deploy search-studios-kakao --project-ref "$SUPABASE_PROJECT_REF" --use-api --yes





      - name: Deploy account deletion endpoint
        run: supabase functions deploy delete-account --project-ref "$SUPABASE_PROJECT_REF" --use-api --yes

      - name: Deploy public privacy policy
        run: supabase functions deploy privacy-policy --project-ref "$SUPABASE_PROJECT_REF" --use-api --yes
