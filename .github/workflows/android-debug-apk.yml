name: Android standalone APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/android-debug-apk.yml"
      - "app/**"
      - "lib/**"
      - "scripts/**"
      - "app.json"
      - "package.json"
      - "package-lock.json"

concurrency:
  group: android-debug-apk-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify Expo native dependency versions
        run: npm ls expo expo-modules-core react-native

      - name: Generate Android native project
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://ykxvcqgdvifogahbbbwr.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_-wvNm1sapw3c1oSdMFLvTQ_BxOm2ADd
        run: npx expo prebuild --platform android --non-interactive

      - name: Build standalone release APK
        working-directory: android
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://ykxvcqgdvifogahbbbwr.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_-wvNm1sapw3c1oSdMFLvTQ_BxOm2ADd
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: balletmate-android-standalone
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
