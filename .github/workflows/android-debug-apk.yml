name: Android standalone APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/android-debug-apk.yml"
      - "app/**"
      - "components/**"
      - "lib/**"
      - "scripts/**"
      - "assets/**"
      - "app.json"
      - "package.json"
      - "package-lock.json"

concurrency:
  group: balletmate-android-apk-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify Expo native dependency versions
        run: npm ls expo expo-modules-core react-native
      - name: Diagnose Expo Android autolinking publication metadata
        run: |
          npx expo-modules-autolinking resolve --platform android --json > autolinking-android.json
          node -e "const c=require('./autolinking-android.json'); for(const [i,m] of (c.modules||[]).entries()) { for(const p of (m.projects||[])) if(p.publication && !p.publication.version) console.log('MISSING_PUBLICATION_VERSION',i,m.packageName,p.name,JSON.stringify(p.publication)); }"

      - name: Generate Android native project
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: npx expo prebuild --platform android --non-interactive

      - name: Configure Gradle memory for release dexing
        working-directory: android
        run: |
          sed -i '/^org.gradle.jvmargs=/d' gradle.properties
          cat >> gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
          org.gradle.workers.max=2
          org.gradle.parallel=false
          EOF

      - name: Build standalone release APK
        working-directory: android
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace --info

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: balletmate-android-standalone
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30


  smoke-test:
    needs: build-android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_I_WANT_MY_TCG: "yes"
    steps:
      - name: Download standalone APK
        uses: actions/download-artifact@v4
        with:
          name: balletmate-android-standalone
          path: artifacts

      - name: Smoke test app launch on Android 16 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: |
            adb install -r artifacts/app-release.apk
            adb shell monkey -p com.dlehdrb554.balletmate 1
            sleep 20
            adb shell pidof com.dlehdrb554.balletmate >/dev/null
            adb logcat -d -s AndroidRuntime:E > /tmp/android-runtime.log
            if grep -q "FATAL EXCEPTION" /tmp/android-runtime.log; then
              cat /tmp/android-runtime.log
              exit 1
            fi

# Build the standalone APK whenever this workflow is updated or app source changes.
