name: Android standalone APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/android-debug-apk.yml"
      - "app/**"
      - "components/**"
      - "lib/**"
      - "scripts/**"
      - "assets/**"
      - "app.json"
      - "package.json"
      - "package-lock.json"

concurrency:
  group: balletmate-android-apk-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-android:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify Expo native dependency versions
        run: npm ls expo expo-modules-core react-native

      - name: Load EAS Preview environment variables
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::GitHub Actions secret EXPO_TOKEN이 필요합니다."
            exit 1
          fi
          npx eas-cli@latest env:pull --environment preview

      - name: Diagnose Expo Android autolinking publication metadata
        run: |
          npx expo-modules-autolinking resolve --platform android --json > autolinking-android.json
          node -e "const c=require('./autolinking-android.json'); for(const [i,m] of (c.modules||[]).entries()) { for(const p of (m.projects||[])) if(p.publication && !p.publication.version) console.log('MISSING_PUBLICATION_VERSION',i,m.packageName,p.name,JSON.stringify(p.publication)); }"

      - name: Generate Android native project
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: npx expo prebuild --platform android --non-interactive

      - name: Verify Kakao key is embedded without printing it
        run: |
          node -e "const c=require('./app.config.js')({config:{}}); if(!c.extra?.kakaoJavascriptKey) { console.error('Kakao JavaScript key is missing from Expo config'); process.exit(1); } console.log('Kakao JavaScript key is present in Expo config.');"

      - name: Configure Gradle memory for release dexing
        working-directory: android
        run: |
          sed -i '/^org.gradle.jvmargs=/d' gradle.properties
          cat >> gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
          org.gradle.workers.max=2
          org.gradle.parallel=false
          EOF

      - name: Build standalone release APK
        working-directory: android
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace --info

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: balletmate-android-standalone
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

  smoke-test:
    needs: build-android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download standalone APK
        uses: actions/download-artifact@v4
        with:
          name: balletmate-android-standalone
          path: artifacts

      - name: Smoke test app launch on Android 16 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: |
            set -Eeuo pipefail
            adb wait-for-device
            for attempt in $(seq 1 120); do
              booted="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
              [ "$booted" = "1" ] && break
              [ "$attempt" -eq 120 ] && { adb logcat -d -b all -v threadtime | tail -n 300 || true; exit 1; }
              sleep 5
            done
            installed=false
            for attempt in 1 2 3; do
              if adb install --no-streaming -r artifacts/app-release.apk; then installed=true; break; fi
              adb reconnect device || true
              adb wait-for-device
              sleep 5
            done
            [ "$installed" = "true" ] || { adb logcat -d -b all -v threadtime | tail -n 500 || true; exit 1; }
            adb shell monkey -p com.dlehdrb554.balletmate 1
            sleep 20
            adb shell pidof com.dlehdrb554.balletmate >/dev/null
            adb logcat -d -b all -v threadtime > /tmp/android-full.log
            if grep -q "FATAL EXCEPTION" /tmp/android-full.log; then
              grep -n -A 100 -B 15 "FATAL EXCEPTION" /tmp/android-full.log || true
              exit 1
            fi
