name: Android standalone APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/android-debug-apk.yml"
      - "app/**"
      - "components/**"
      - "lib/**"
      - "scripts/**"
      - "assets/**"
      - "app.json"
      - "package.json"
      - "package-lock.json"

concurrency:
  group: balletmate-android-apk-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Android builds run only when explicitly requested.
  build-android:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify Expo native dependency versions
        run: npm ls expo expo-modules-core react-native
      - name: Diagnose Expo Android autolinking publication metadata
        run: |
          npx expo-modules-autolinking resolve --platform android --json > autolinking-android.json
          node -e "const c=require('./autolinking-android.json'); for(const [i,m] of (c.modules||[]).entries()) { for(const p of (m.projects||[])) if(p.publication && !p.publication.version) console.log('MISSING_PUBLICATION_VERSION',i,m.packageName,p.name,JSON.stringify(p.publication)); }"

      - name: Generate Android native project
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: npx expo prebuild --platform android --non-interactive

      - name: Configure Gradle memory for release dexing
        working-directory: android
        run: |
          sed -i '/^org.gradle.jvmargs=/d' gradle.properties
          cat >> gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
          org.gradle.workers.max=2
          org.gradle.parallel=false
          EOF

      - name: Build standalone release APK
        working-directory: android
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace --info

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: balletmate-android-standalone
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

  smoke-test:
    needs: build-android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download standalone APK
        uses: actions/download-artifact@v4
        with:
          name: balletmate-android-standalone
          path: artifacts

      - name: Smoke test app launch on Android 16 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: |
            set -Eeuo pipefail

            echo "Waiting for Android device..."
            adb wait-for-device
            for attempt in $(seq 1 120); do
              booted="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
              if [ "$booted" = "1" ]; then
                break
              fi
              if [ "$attempt" -eq 120 ]; then
                echo "Emulator did not finish booting."
                adb devices -l || true
                adb logcat -d -b all -v threadtime | tail -n 300 || true
                exit 1
              fi
              sleep 5
            done

            echo "Waiting for Package Manager..."
            for attempt in $(seq 1 60); do
              if adb shell service check package 2>&1 | grep -q "found"; then
                break
              fi
              if [ "$attempt" -eq 60 ]; then
                echo "Android Package Manager is unavailable."
                adb shell getprop || true
                adb logcat -d -b all -v threadtime | tail -n 300 || true
                exit 1
              fi
              sleep 2
            done

            echo "Installing APK without streamed install..."
            installed=false
            for attempt in 1 2 3; do
              if adb install --no-streaming -r artifacts/app-release.apk; then
                installed=true
                break
              fi
              echo "APK installation attempt $attempt failed; reconnecting ADB..."
              adb reconnect device || true
              adb wait-for-device
              sleep 5
            done

            if [ "$installed" != "true" ]; then
              echo "APK installation failed after 3 attempts. Device diagnostics:"
              adb devices -l || true
              adb shell df -h /data || true
              adb shell dumpsys package || true
              adb logcat -d -b all -v threadtime | tail -n 500 || true
              exit 1
            fi

            echo "Launching Balletmate..."
            adb shell monkey -p com.dlehdrb554.balletmate 1
            sleep 20
            if ! adb shell pidof com.dlehdrb554.balletmate >/dev/null; then
              echo "Balletmate process was not running after launch."
              adb logcat -d -b all -v threadtime | tail -n 500 || true
              exit 1
            fi

            adb logcat -d -b all -v threadtime > /tmp/android-full.log
            if grep -q "FATAL EXCEPTION" /tmp/android-full.log; then
              echo "Android app crashed during startup. Crash details:"
              grep -n -A 100 -B 15 "FATAL EXCEPTION" /tmp/android-full.log || true
              exit 1
            fi
