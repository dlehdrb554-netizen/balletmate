name: Mobile build and Supabase deploy

on:
  workflow_dispatch:
    inputs:
      task:
        description: "실행할 작업을 선택하세요"
        required: true
        type: choice
        options:
          - validate-only
          - android-preview
          - android-production
          - deploy-kakao-function

permissions:
  contents: read

concurrency:
  group: mobile-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate project
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript and JSX checks
        run: npm run typecheck
      - name: Expo dependency health check
        run: npx expo-doctor@1.20.5
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Supabase Edge Functions
        run: deno check supabase/functions/*/index.ts

  android:
    name: EAS Android build
    needs: validate
    if: ${{ inputs.task == 'android-preview' || inputs.task == 'android-production' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check EAS token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::GitHub Actions secret EXPO_TOKEN이 등록되지 않았습니다."
            exit 1
          fi
      - name: Build Android preview APK
        if: ${{ inputs.task == 'android-preview' }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli@latest build --platform android --profile preview --non-interactive
      - name: Build Android production AAB
        if: ${{ inputs.task == 'android-production' }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli@latest build --platform android --profile production --non-interactive

  deploy-kakao:
    name: Deploy Kakao search Edge Function
    needs: validate
    if: ${{ inputs.task == 'deploy-kakao-function' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check Supabase access token
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::GitHub Actions secret SUPABASE_ACCESS_TOKEN이 등록되지 않았습니다."
            exit 1
          fi
      - name: Deploy only search-studios-kakao
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npx supabase@latest functions deploy search-studios-kakao --project-ref ykxvcqgdvifogahbbbwr
